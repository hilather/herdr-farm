name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Line tables keep panics readable while shrinking the 73 test binaries
  # (the archive is uploaded once and unpacked on every runner).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Build test archive
        run: cargo nextest archive --locked --features state-store --archive-file nextest-archive.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst
          retention-days: 3

  test:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      # Some tests compile stand-in agents with rustc at runtime.
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Host prerequisites
        run: |
          # The worker sandbox uses unprivileged user namespaces, which
          # Ubuntu 24.04 restricts through AppArmor by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server openssh-client
          git config --global user.name ci
          git config --global user.email ci@invalid
          df -h / /dev/shm
          mkdir -p nextest-extract
      - uses: actions/download-artifact@v4
        with:
          name: nextest-archive
      - name: Run tests (partition ${{ matrix.partition }}/4)
        # The runner's /dev/shm is too small for the unpacked archive; use
        # its disk temp directory for test scratch and unpack in the workspace.
        env:
          TMPDIR: ${{ runner.temp }}
        run: >
          cargo nextest run --profile ci
          --archive-file nextest-archive.tar.zst
          --workspace-remap .
          --extract-to nextest-extract
          --partition count:${{ matrix.partition }}/4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.partition }}
          path: target/nextest/ci/junit.xml
          retention-days: 7
