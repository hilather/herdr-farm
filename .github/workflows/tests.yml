name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Line tables keep panics readable while shrinking the 73 test binaries
  # (the archive is uploaded once and unpacked on every runner).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare test scratch outside checkout and private mounts
        run: |
          # Keep the owner-home anchor, but avoid work/_temp and the checkout.
          # /tmp, /var/tmp and /dev/shm are replaced by private worker mounts.
          mkdir -p "$HOME/.cache"
          scratch=$(mktemp -d "$HOME/.cache/hf-ci-XXXXXX")
          echo "TMPDIR=$scratch" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_TMPDIR=$scratch" >> "$GITHUB_ENV"
      # herdr-farm requires SQLite 3.53.4+ (Ubuntu 24.04 ships 3.45.1).
      # Built from the release source, pinned by SHA-256, cached per version.
      - name: Cache SQLite
        id: sqlite-cache
        uses: actions/cache@v4
        with:
          path: ~/sqlite
          key: sqlite-3530400-ubuntu-24.04
      - name: Build SQLite 3.53.4
        if: steps.sqlite-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o sqlite.tgz https://sqlite.org/2026/sqlite-autoconf-3530400.tar.gz
          echo "0e9483900e92cd5de8fd48d16bf9200145a61f7fd5be542a5ac81d8a9516eb9c  sqlite.tgz" | sha256sum -c -
          tar -xzf sqlite.tgz
          cd sqlite-autoconf-3530400
          ./configure --prefix="$HOME/sqlite" --disable-static
          make -j"$(nproc)"
          make install
      - name: Use SQLite 3.53.4
        run: |
          echo "PKG_CONFIG_PATH=$HOME/sqlite/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/sqlite/lib" >> "$GITHUB_ENV"
          # Tests start the CLI with a cleared environment; an rpath keeps the
          # binaries on this SQLite without LD_LIBRARY_PATH.
          echo "RUSTFLAGS=-C link-arg=-Wl,-rpath,$HOME/sqlite/lib" >> "$GITHUB_ENV"
          echo "$HOME/sqlite/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Build test archive
        run: cargo nextest archive --locked --features state-store --archive-file nextest-archive.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst
          retention-days: 3

  test:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare test scratch outside checkout and private mounts
        run: |
          # Keep the owner-home anchor, but avoid work/_temp and the checkout.
          # /tmp, /var/tmp and /dev/shm are replaced by private worker mounts.
          mkdir -p "$HOME/.cache"
          scratch=$(mktemp -d "$HOME/.cache/hf-ci-XXXXXX")
          echo "TMPDIR=$scratch" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_TMPDIR=$scratch" >> "$GITHUB_ENV"
      # herdr-farm requires SQLite 3.53.4+ (Ubuntu 24.04 ships 3.45.1).
      # Built from the release source, pinned by SHA-256, cached per version.
      - name: Cache SQLite
        id: sqlite-cache
        uses: actions/cache@v4
        with:
          path: ~/sqlite
          key: sqlite-3530400-ubuntu-24.04
      - name: Build SQLite 3.53.4
        if: steps.sqlite-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o sqlite.tgz https://sqlite.org/2026/sqlite-autoconf-3530400.tar.gz
          echo "0e9483900e92cd5de8fd48d16bf9200145a61f7fd5be542a5ac81d8a9516eb9c  sqlite.tgz" | sha256sum -c -
          tar -xzf sqlite.tgz
          cd sqlite-autoconf-3530400
          ./configure --prefix="$HOME/sqlite" --disable-static
          make -j"$(nproc)"
          make install
      - name: Use SQLite 3.53.4
        run: |
          echo "PKG_CONFIG_PATH=$HOME/sqlite/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/sqlite/lib" >> "$GITHUB_ENV"
          # Tests start the CLI with a cleared environment; an rpath keeps the
          # binaries on this SQLite without LD_LIBRARY_PATH.
          echo "RUSTFLAGS=-C link-arg=-Wl,-rpath,$HOME/sqlite/lib" >> "$GITHUB_ENV"
          echo "$HOME/sqlite/bin" >> "$GITHUB_PATH"
      # Some tests compile stand-in agents with rustc at runtime.
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Host prerequisites
        run: |
          # The worker sandbox uses unprivileged user namespaces, which
          # Ubuntu 24.04 restricts through AppArmor by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server openssh-client
          git config --global user.name ci
          git config --global user.email ci@invalid
          df -h / /dev/shm
      - name: Worker sandbox diagnostics
        run: |
          # Diagnostic failures must leave the full test gate running.
          set +e
          uname -a
          cat /proc/sys/kernel/unprivileged_userns_clone /proc/sys/user/max_user_namespaces 2>&1
          sysctl -a 2>/dev/null | grep apparmor
          unshare --version
          mount --version
          unshare --user --map-root-user --mount --pid --fork true
          echo "user/mount/pid namespace status=$?"
          # Match --mount-proc and the second user namespace used by workers.
          unshare --user --map-root-user --pid --fork --mount-proc --kill-child=KILL -- sh -c '
            probe() { "$@"; echo "primitive status=$?: $*"; }
            d=$(mktemp -d "$TMPDIR/sandbox-probe-XXXXXX") || exit 1
            trap "rm -rf -- \"\$d\"" EXIT
            # Match the owner-home anchor and execution-home writable exposure.
            # The rest of TMPDIR stays read-only; only this lab home is writable.
            mkdir "$d/exec-home"
            printf "%s\n" "printf scratch-write > \"\$1/exec-home/probe\" && test -s \"\$1/exec-home/probe\" && ! touch \"\$1/owner-write-must-fail\"" > "$d/scratch-probe.sh"
            # A separate mount namespace drops these mounts before other probes.
            probe unshare --mount -- sh -c "
              mount --rbind -o ro=recursive \"\$1\" \"\$1\" &&
              mount --rbind -o rw \"\$2/exec-home\" \"\$2/exec-home\" &&
              mount -t tmpfs -o nosuid,nodev,mode=1777 herdr-farm-private /tmp &&
              unshare --user --map-root-user -- sh \"\$2/scratch-probe.sh\" \"\$2\"
            " sh "$HOME" "$d"
            mkdir "$d/tmpfs" "$d/lower" "$d/upper" "$d/work" "$d/merged" "$d/ro"
            probe mount -t tmpfs -o nosuid,nodev,mode=1777 herdr-farm-private "$d/tmpfs"
            probe mount -t overlay -o "lowerdir=$d/lower,upperdir=$d/upper,workdir=$d/work,userxattr,index=off,metacopy=off,redirect_dir=nofollow" herdr-farm-git "$d/merged"
            probe mount --rbind -o ro=recursive "$d/ro" "$d/ro"
            probe unshare --user --map-root-user -- true
            umount "$d/ro" "$d/merged" "$d/tmpfs"
          '
          echo "product namespace/mount probe status=$?"
          sudo dmesg | tail -80
          exit 0
      - uses: actions/download-artifact@v4
        with:
          name: nextest-archive
      - name: Run tests (partition ${{ matrix.partition }}/8)
        # Tests find the CLI through the compile-time CARGO_BIN_EXE path, so
        # unpack target/ into the workspace at the path it was built at.
        run: >
          cargo nextest run --profile ci
          --archive-file nextest-archive.tar.zst
          --workspace-remap .
          --extract-to ${{ github.workspace }}
          --extract-overwrite
          --partition count:${{ matrix.partition }}/8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.partition }}
          path: target/nextest/ci/junit.xml
          retention-days: 7
