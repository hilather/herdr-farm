# cargo-nextest configuration. Run: `cargo nextest run --features state-store`.
# nextest runs every test of every binary in one parallel pool, one process
# per test; plain `cargo test` runs the binaries one after another.

[profile.default]
# Many E2E tests spawn a ticker, Herdr stand-ins and sandboxed workers; more
# parallelism than this makes their timing-bounded waits flaky.
test-threads = 6
fail-fast = false
status-level = "fail"
final-status-level = "slow"
# Report a test as slow after 60 s; terminate it after 10 minutes.
slow-timeout = { period = "60s", terminate-after = 10 }

[test-groups]
# Concurrency and scale tests measure contention themselves.
heavy = { max-threads = 1 }
# Worker sandbox labs share a smaller pool than the other E2E tests.
sandbox = { max-threads = 3 }

[[profile.default.overrides]]
filter = "binary(canonical_worker) | binary(operator_launch) | binary(worker_login_share) | binary(replay_suite) | binary(thread_sandbox)"
test-group = "sandbox"

[[profile.default.overrides]]
filter = "binary(telemetry_scale)"
test-group = "heavy"

# Quick inner loop: everything except the ticker-driven end-to-end groups.
# The CI merge gate uses ci; the long idle workflow runs with nightly.
[profile.fast]
default-filter = "not (binary(cli) | binary(artifacts) | binary(canonical_worker) | binary(recovery) | binary(delivery) | binary(ticker_jobs) | binary(ticker) | binary(controller) | binary(pull_requests) | binary(adopt) | binary(remote) | binary(routines) | binary(operator_launch) | binary(telemetry_scale))"

[[profile.fast.overrides]]
filter = "binary(canonical_worker) | binary(operator_launch) | binary(worker_login_share) | binary(replay_suite) | binary(thread_sandbox)"
test-group = "sandbox"

[[profile.fast.overrides]]
filter = "binary(telemetry_scale)"
test-group = "heavy"

# GitHub Actions: JUnit output, partitioned across runners with
# `--partition hash:N/8`.
[profile.ci]
# This multi-stretch cadence workflow takes about seven minutes on the owner host.
# Keep its full assertions in the nightly gate.
# CI-OWNER-DEATH-1: owner-death notification waits allow slow hosted runners;
# this workflow runs in the CI gate again.
default-filter = "not (binary(canonical_worker) & test(idle_worker_notice_restarts_stretch_and_deduplicates_within_a_ticker))"
test-threads = 4
# Owner rule: a test that fails once and passes on retry counts as green and
# is reported FLAKY; a test failing both tries blocks.
retries = 1
# All suites run on hosted Linux runners; scratch lives in the owner cache, outside the checkout/private mounts.
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10 }

[profile.ci.junit]
path = "junit.xml"

[[profile.ci.overrides]]
filter = "binary(canonical_worker) | binary(operator_launch) | binary(worker_login_share) | binary(replay_suite) | binary(thread_sandbox)"
test-group = "sandbox"

[[profile.ci.overrides]]
filter = "binary(telemetry_scale)"
test-group = "heavy"

# Run explicitly with --profile nightly; the steward schedules this workflow.
[profile.nightly]
default-filter = "binary(canonical_worker) & test(idle_worker_notice_restarts_stretch_and_deduplicates_within_a_ticker)"
test-threads = 1
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 15 }
