# cargo-nextest configuration. Run: `cargo nextest run --features state-store`.
# nextest runs every test of every binary in one parallel pool, one process
# per test; plain `cargo test` runs the binaries one after another.

[profile.default]
# Many E2E tests spawn a ticker, Herdr stand-ins and sandboxed workers; more
# parallelism than this makes their timing-bounded waits flaky.
test-threads = 6
fail-fast = false
status-level = "fail"
final-status-level = "slow"
# Report a test as slow after 60 s; terminate it after 10 minutes.
slow-timeout = { period = "60s", terminate-after = 10 }

[test-groups]
# Concurrency and scale tests measure contention themselves.
heavy = { max-threads = 1 }

[[profile.default.overrides]]
filter = "binary(telemetry_scale)"
test-group = "heavy"

# Quick inner loop: everything except the ticker-driven end-to-end groups.
# The merge gate always runs the default profile (everything).
[profile.fast]
default-filter = "not (binary(cli) | binary(artifacts) | binary(canonical_worker) | binary(recovery) | binary(delivery) | binary(ticker_jobs) | binary(ticker) | binary(controller) | binary(pull_requests) | binary(adopt) | binary(remote) | binary(routines) | binary(operator_launch) | binary(telemetry_scale))"

[[profile.fast.overrides]]
filter = "binary(telemetry_scale)"
test-group = "heavy"

# GitHub Actions: JUnit output, partitioned across runners with
# `--partition count:N/M`.
[profile.ci]
test-threads = 4
# Owner rule: a test that fails once and passes on retry counts as green and
# is reported FLAKY; a test failing both tries blocks.
retries = 1
# The worker-sandbox tests (unshare + mounts) don't run on GitHub-hosted
# runners yet (read-only mounts over the workspace); they stay in the local
# merge gate (default profile) until CI-PORTABILITY-1 makes them portable, as
# do a few runner-specific failures (migration plan fingerprint, health interval).
default-filter = "not (binary(canonical_worker) | binary(operator_launch) | binary(worker_login_share) | binary(replay_suite) | test(=a_sandboxed_worker_cannot_elevate_its_own_report) | test(=outcome_success_path) | test(=ticker_canonical_notification_confirms_or_retains_ambiguity_after_owner_death) | test(=admission::tests::admission_resumes_after_a_full_page_of_unsigned_candidates) | test(=canonical_worker::tests::launch_advancement_recovers_each_boundary_then_delivers_brief_and_stops) | test(=finalization_delivery::tests::cancelled_finalization_and_receipt_io_preserve_unresolved_intent) | test(=canonical_finalization_jobs::tests::stop_snapshot_finalizes_without_source_in_foreground_and_queued_paths) | test(=ticker_health_requires_operator_opt_in_obeys_interval_and_never_notifies))"
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10 }

[profile.ci.junit]
path = "junit.xml"

[[profile.ci.overrides]]
filter = "binary(telemetry_scale)"
test-group = "heavy"
